<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Profile README Banner Preview - nomaan5541</title>
  <style>
    :root {
      --bg-dark: #090d16;
      --panel-dark: #0f172a;
      --text-dark: #f8fafc;
      --border-dark: rgba(255, 255, 255, 0.1);
      
      --bg-light: #f8fafc;
      --panel-light: #ffffff;
      --text-light: #0f172a;
      --border-light: rgba(15, 23, 42, 0.1);
    }

    body {
      margin: 0;
      padding: 32px 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-dark);
      transition: background-color 0.3s ease, color 0.3s ease;
      min-height: 100vh;
      box-sizing: border-box;
    }

    body.light-mode {
      background-color: var(--bg-light);
      color: var(--text-light);
    }

    .container {
      max-width: 1240px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    body.light-mode header {
      border-bottom-color: rgba(15,23,42,0.1);
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 4px 8px;
      border-radius: 6px;
      background: linear-gradient(135deg, #7c3aed, #22d3ee);
      color: #fff;
    }

    .controls {
      display: flex;
      gap: 12px;
    }

    button {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid rgba(255,255,255,0.15);
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    button:hover {
      background: #334155;
      transform: translateY(-1px);
    }

    body.light-mode button {
      background: #e2e8f0;
      color: #0f172a;
      border-color: rgba(15,23,42,0.15);
    }

    body.light-mode button:hover {
      background: #cbd5e1;
    }

    .section-title {
      font-size: 16px;
      font-weight: 600;
      margin: 28px 0 16px;
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    body.light-mode .section-title {
      color: #475569;
    }

    .banner-card {
      background: var(--panel-dark);
      border: 1px solid var(--border-dark);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      margin-bottom: 40px;
      transition: all 0.3s ease;
    }

    body.light-mode .banner-card {
      background: var(--panel-light);
      border-color: var(--border-light);
      box-shadow: 0 20px 40px rgba(15,23,42,0.06);
    }

    .svg-wrapper {
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
    }

    .svg-wrapper img, .svg-wrapper svg {
      width: 100%;
      height: auto;
      display: block;
    }

    .github-readme-sim {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 24px;
      color: #c9d1d9;
    }

    body.light-mode .github-readme-sim {
      background: #ffffff;
      border-color: #d0d7de;
      color: #1f2328;
    }

    .readme-header {
      font-size: 20px;
      font-weight: 600;
      padding-bottom: 12px;
      border-bottom: 1px solid #21262d;
      margin-top: 0;
      margin-bottom: 20px;
    }

    body.light-mode .readme-header {
      border-bottom-color: #d8dee4;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>
        ⚡ GitHub Hero Banner Preview 
        <span class="badge">Pure SVG + SMIL</span>
      </h1>
      <div class="controls">
        <button onclick="toggleTheme()">🌓 Toggle Page Theme</button>
      </div>
    </header>

    <!-- Dark Mode SVG Banner -->
    <div class="section-title">
      <span>🌙 DARK MODE BANNER (dark.svg)</span>
      <span>1180 × 610 SVG</span>
    </div>
    <div class="banner-card">
      <div class="svg-wrapper">
        <img src="dark.svg" alt="Dark Mode Hero Banner" />
      </div>
    </div>

    <!-- Light Mode SVG Banner -->
    <div class="section-title">
      <span>☀️ LIGHT MODE BANNER (light.svg)</span>
      <span>1180 × 610 SVG</span>
    </div>
    <div class="banner-card">
      <div class="svg-wrapper">
        <img src="light.svg" alt="Light Mode Hero Banner" />
      </div>
    </div>

    <!-- GitHub README Live Simulation -->
    <div class="section-title">
      <span>🐙 GITHUB README RENDER SIMULATION</span>
    </div>
    <div class="github-readme-sim">
      <h2 class="readme-header">README.md Preview for @nomaan5541</h2>
      <picture>
        <source media="(prefers-color-scheme: dark)" srcset="dark.svg">
        <source media="(prefers-color-scheme: light)" srcset="light.svg">
        <img src="dark.svg" alt="nomaan5541 Hero Banner" style="width: 100%; border-radius: 12px;">
      </picture>
    </div>
  </div>

  <script>
    function toggleTheme() {
      document.body.classList.toggle('light-mode');
    }
  </script>
</body>
</html>
